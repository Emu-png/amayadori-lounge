<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amayadori Lounge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Share+Tech+Mono&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: full-bleed WebGL lounge; a translucent arrival card picks the destination; in-scene UI lives on a 3D tablet so VR and flat screens share it. Single night look. */
:root{
  --ink:#07040e;
  --panel:rgba(12,8,22,.84);
  --cyan:#3ef2ff;
  --rose:#ff7ab6;
  --amber:#ffc27a;
  --text:#eef3ff;
  --dim:#98a0bd;
  --line:rgba(255,194,122,.28);
  --display:"Chakra Petch","Arial Narrow",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --mono:"Share Tech Mono",ui-monospace,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);overflow:hidden;font-family:var(--body)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c.hover{cursor:pointer}
.screen{position:fixed;inset:0;display:grid;place-items:center;z-index:20;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;
  background:radial-gradient(ellipse at 50% 110%,rgba(255,122,182,.16),transparent 60%),rgba(7,4,14,.45);overflow-y:auto}
.panel{width:min(600px,100%);box-sizing:border-box;background:var(--panel);border:1px solid var(--line);padding:28px 26px;display:grid;gap:18px;
  box-shadow:0 30px 80px rgba(0,0,0,.6);backdrop-filter:blur(6px)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:var(--amber)}
h1{font-family:var(--display);font-weight:500;font-size:clamp(38px,9vw,62px);line-height:.95;margin:0;letter-spacing:.04em;
  text-shadow:0 0 22px rgba(255,122,182,.45);text-wrap:balance}
h1 small{display:block;font-family:var(--body);font-weight:400;font-size:15px;letter-spacing:.42em;color:var(--rose);text-shadow:none;margin-top:12px}
p{margin:0;line-height:1.8;color:#d3d9ee;font-size:14.5px}
.dests{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.dest{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:6px;padding:16px 16px 14px;border:1px solid var(--line);background:rgba(255,194,122,.05);min-width:0;transition:background .2s,border-color .2s}
.dest:hover,.dest:focus-visible{background:rgba(255,194,122,.14);border-color:var(--amber)}
.dest:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.dest b{font-size:18px;font-weight:700}
.dest span{font-size:12.5px;color:var(--dim);line-height:1.6}
.dest i{font-style:normal;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--rose)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button.vr{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;cursor:pointer;border:0;padding:12px 20px;color:var(--ink);background:var(--cyan)}
button.vr:disabled{background:#2a2840;color:#6b6a85;cursor:not-allowed}
button.vr:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.status{font-family:var(--mono);font-size:12px;color:var(--dim);line-height:1.6}
.hint{font-size:12.5px;color:var(--dim);line-height:1.7}
#home{position:fixed;z-index:12;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));
  font-family:var(--body);font-size:13px;color:var(--text);background:rgba(12,8,22,.6);border:1px solid var(--line);padding:8px 14px;cursor:pointer}
#home:focus-visible{outline:2px solid var(--amber)}
#caption{position:fixed;z-index:12;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100vw - 32px);box-sizing:border-box;
  font-size:15px;line-height:1.6;text-align:center;background:rgba(12,8,22,.66);padding:10px 18px;border-left:2px solid var(--amber);opacity:0;transition:opacity .5s;pointer-events:none}
#caption.show{opacity:1}
#tip{position:fixed;z-index:12;top:calc(18px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));font-size:12px;color:var(--dim);background:rgba(12,8,22,.5);padding:6px 10px;max-width:50vw}
</style>
</head>
<body>


<canvas id="c"></canvas>
<button id="home" type="button" hidden>← 行き先を選ぶ</button>
<div id="tip" hidden>ドラッグで見回す · 光るパネルや床の輪をクリック</div>
<div id="caption"></div>

<section id="menu" class="screen">
  <div class="panel">
    <div class="eyebrow">// 2089 · カグラ区 · 今夜の雨量 412mm</div>
    <h1>AMAYADORI<small>雨宿りラウンジ</small></h1>
    <p>雨の止まない未来都市の片隅にある、ひと休みのための場所です。目的はありません。窓の外のネオンを眺めて、飲み物を頼んで、少し深呼吸していってください。</p>
    <div class="dests">
      <button class="dest" type="button" data-space="cafe"><i>STREET LEVEL</i><b>カフェ「雨音」</b><span>窓際の席から、雨に濡れた路地と行き交う人々を眺める。窓を打つ雨音と暖かい灯り。</span></button>
      <button class="dest" type="button" data-space="bar"><i>ALT 52M</i><b>空中バー「宵闇」</b><span>街の上に浮かぶテラス。眼下を空飛ぶ車が流れ、巨大なホログラムがゆっくり回る。</span></button>
    </div>
    <div class="row">
      <button id="vrbtn" class="vr" type="button" disabled>VRで入る（カフェから）</button>
      <span class="status" id="vrstatus">VR対応を確認中…</span>
    </div>
    <div class="hint">PC・スマホ：ドラッグで見回し、光るパネルをクリック／タップ。<br>VR：コントローラーで指してトリガー。座ったままで楽しめます。</div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/three@0.137.5/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.137.5/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@0.6.11/lib/three-vrm.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const V3=THREE.Vector3;
const JPFONT='"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic","Meiryo",sans-serif';
const NEON=[0x3ef2ff,0xff2e88,0xffb627,0x9d5cff,0x39ff9e,0xff5a36];
const hex=c=>'#'+c.toString(16).padStart(6,'0');

/* ---------- renderer / scene ---------- */
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.xr.enabled=true;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x150a24);
scene.fog=new THREE.FogExp2(0x150a24,0.014);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,0.03,500);
const rig=new THREE.Group();rig.add(camera);scene.add(rig);
camera.position.y=1.32;
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
const hemi=new THREE.HemisphereLight(0x6a4cff,0x1a0820,0.35);scene.add(hemi);

function glowTexture(){const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');
  const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.25,'rgba(255,255,255,.55)');gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);}
const GLOW=glowTexture();
const glowSprite=(color,s,op)=>{const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW,color,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:op==null?1:op}));sp.scale.set(s,s,1);return sp;};

/* ---------- street ---------- */
(function(){
  const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  g.fillStyle='#16141f';g.fillRect(0,0,256,256);
  for(let i=0;i<3000;i++){const v=Math.floor(rand(10,40));g.fillStyle=`rgb(${v},${v},${v+8})`;g.fillRect(rand(0,256),rand(0,256),2,2);}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(8,30);
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(80,300),new THREE.MeshStandardMaterial({color:0x3a3650,map:t,roughness:.22,metalness:.65}));
  ground.rotation.x=-Math.PI/2;scene.add(ground);
  const curbM=new THREE.MeshStandardMaterial({color:0x24222e,roughness:.4,metalness:.4});
  for(const s of [-1,1]){const curb=new THREE.Mesh(new THREE.BoxGeometry(2.4,.12,300),curbM);curb.position.set(s*6.8,.06,0);scene.add(curb);}
  const dashM=new THREE.MeshBasicMaterial({color:0x2a8a96});
  for(let z=-140;z<140;z+=6){const d=new THREE.Mesh(new THREE.PlaneGeometry(.15,2.4),dashM);d.rotation.x=-Math.PI/2;d.position.set(0,.01,z);scene.add(d);}
  const lc=[0x3ef2ff,0xff2e88,0x9d5cff,0x3ef2ff];
  [[-4.5,-20],[4.5,-2],[-4.5,14],[4.5,-50]].forEach(([x,z],i)=>{const l=new THREE.PointLight(lc[i],1.6,22,1);l.position.set(x,4,z);scene.add(l);});
})();

function windowTexture(palette){
  const c=document.createElement('canvas');c.width=128;c.height=256;const g=c.getContext('2d');
  g.fillStyle='#08070e';g.fillRect(0,0,128,256);
  for(let y=0;y<256;y+=8)for(let x=0;x<128;x+=8){if(Math.random()<.32){g.globalAlpha=rand(.25,1);g.fillStyle=pick(palette);g.fillRect(x+2,y+2,4,5);}}
  g.globalAlpha=1;const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}
const bMats=[['#ffd28a','#fff3d6','#8fe9ff'],['#8fe9ff','#c9b6ff','#ffffff'],['#ff8ac4','#ffd28a','#8fe9ff'],['#c9b6ff','#8fe9ff','#39ff9e']]
  .map(p=>new THREE.MeshBasicMaterial({map:windowTexture(p)}));
function scaleBoxUV(geo,w,h,d){const uv=geo.attributes.uv;
  for(let f=0;f<6;f++){let su,sv;if(f<2){su=d/24;sv=h/48}else if(f<4){su=0;sv=0}else{su=w/24;sv=h/48}
    for(let i=0;i<4;i++){const k=f*4+i;uv.setXY(k,uv.getX(k)*su,uv.getY(k)*sv);}}
  uv.needsUpdate=true;}
function building(x,z,w,h,d,y0){const geo=new THREE.BoxGeometry(w,h,d);scaleBoxUV(geo,w,h,d);
  const m=new THREE.Mesh(geo,pick(bMats));m.position.set(x,(y0||0)+h/2,z);scene.add(m);}

const VWORDS=['電脳','夜市','義体修理','回路屋','無限','酒場','記憶売買','雨宿り','薬局','拉麺','情報','人工臓器','銭湯','質屋'];
const HWORDS=['NOODLE','BAR 24H','HOTEL','DATA','CHROME','OPEN','KARAOKE','ラーメン','カプセル','TATTOO'];
const signs=[];
function signTexture(text,color,vertical){
  const c=document.createElement('canvas');const W=vertical?128:512,H=vertical?512:128;c.width=W;c.height=H;const g=c.getContext('2d');
  const css=hex(color);g.strokeStyle=css;g.lineWidth=6;g.shadowColor=css;g.shadowBlur=18;g.strokeRect(12,12,W-24,H-24);
  g.fillStyle='#fff';g.shadowBlur=26;g.textAlign='center';g.textBaseline='middle';
  if(vertical){const ch=[...text];const size=Math.min(92,(H-70)/ch.length);g.font=`900 ${size}px ${JPFONT}`;
    const top=(H-ch.length*size)/2;ch.forEach((k,i)=>g.fillText(k,W/2,top+size/2+i*size));}
  else{let size=78;g.font=`900 ${size}px ${JPFONT}`;while(g.measureText(text).width>W-70&&size>24){size-=4;g.font=`900 ${size}px ${JPFONT}`;}g.fillText(text,W/2,H/2+4);}
  g.globalCompositeOperation='source-atop';g.shadowBlur=0;g.fillStyle=css;g.globalAlpha=.35;g.fillRect(0,0,W,H);
  return new THREE.CanvasTexture(c);
}
const signMat=tex=>new THREE.MeshBasicMaterial({map:tex,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});
const reflM={};
function groundGlow(x,z,color,sx,sz){
  if(!reflM[color])reflM[color]=new THREE.MeshBasicMaterial({map:GLOW,color,transparent:true,opacity:.32,blending:THREE.AdditiveBlending,depthWrite:false});
  const r=new THREE.Mesh(new THREE.PlaneGeometry(1,1),reflM[color]);r.rotation.x=-Math.PI/2;r.scale.set(sx,sz,1);r.position.set(x,.02,z);scene.add(r);
}
function addSign(side,fx,z,y){
  const color=pick(NEON);const blade=Math.random()<.55;
  const mat=signMat(signTexture(blade?pick(VWORDS):pick(HWORDS),color,blade));
  const m=new THREE.Mesh(new THREE.PlaneGeometry(blade?1.3:5.2,blade?5.2:1.3),mat);
  if(blade)m.position.set(fx-side*1.0,y,z);else{m.rotation.y=-side*Math.PI/2;m.position.set(fx-side*.06,y,z);}
  scene.add(m);signs.push({mat,flicker:Math.random()<.15});
  if(y<12)groundGlow(fx-side*2.6,z,color,blade?2.2:6,blade?5:2.2);
}
const FACADE=8;
for(const side of [-1,1]){
  let z=-130;
  while(z<130){
    if(side===1&&z<13&&z>-14){z=13;continue;} // café block
    const w=rand(7,12),d=rand(8,14),h=rand(18,72);
    if(side===1&&z<0&&z+d>-1){const dd=-1-z;if(dd>3)building(FACADE+w/2,z+dd/2,w,h,dd);z=13;continue;}
    building(side*(FACADE+w/2),z+d/2,w,h,d);
    const n=Math.floor(rand(1,3.99));
    for(let k=0;k<n;k++)addSign(side,side*FACADE,z+rand(1.2,d-1.2),rand(4.2,Math.min(h-3,20)));
    z+=d+rand(.3,1.8);
  }
  for(let z2=-150;z2<150;z2+=rand(12,22))building(side*rand(28,44),z2,rand(10,18),rand(60,150),rand(10,18));
}
for(let x=-40;x<=40;x+=rand(10,16)){building(x,-160,rand(12,20),rand(80,170),rand(12,20));building(x,160,rand(12,20),rand(80,170),rand(12,20));}

(function(){
  const cableM=new THREE.LineBasicMaterial({color:0x2c2a3c});
  const lm=[0xff5a36,0xffb627,0xff2e88].map(c=>new THREE.SpriteMaterial({map:GLOW,color:c,blending:THREE.AdditiveBlending,depthWrite:false}));
  for(let z=-120;z<=120;z+=rand(12,18)){
    const pts=[];const y0=rand(10,14);
    for(let i=0;i<=10;i++){const tt=i/10;pts.push(new V3(-FACADE+tt*FACADE*2,y0-Math.sin(tt*Math.PI)*1.6,z));}
    scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),cableM));
    const mat=pick(lm);
    for(let i=1;i<10;i++){const s=new THREE.Sprite(mat);s.position.copy(pts[i]).y-=.25;s.scale.set(.7,.7,.7);scene.add(s);}
  }
})();

const holo=new THREE.Group();
holo.add(new THREE.Mesh(new THREE.IcosahedronGeometry(6,1),new THREE.MeshBasicMaterial({color:0x3ef2ff,wireframe:true,transparent:true,opacity:.45,blending:THREE.AdditiveBlending,fog:false,depthWrite:false})));
const holoRing=new THREE.Mesh(new THREE.TorusGeometry(9,.08,6,64),new THREE.MeshBasicMaterial({color:0xff2e88,transparent:true,opacity:.7,blending:THREE.AdditiveBlending,fog:false}));
holoRing.rotation.x=Math.PI/2.4;holo.add(holoRing);holo.position.set(0,58,-40);scene.add(holo);
const bbC=document.createElement('canvas');bbC.width=512;bbC.height=256;const bbG=bbC.getContext('2d');
const bbTex=new THREE.CanvasTexture(bbC);const bbMat=new THREE.MeshBasicMaterial({map:bbTex,fog:false});
function drawBillboard(tt){
  const gr=bbG.createLinearGradient(0,0,512,256);gr.addColorStop(0,'#ff2e88');gr.addColorStop(1,'#3b0d6e');
  bbG.fillStyle=gr;bbG.fillRect(0,0,512,256);
  bbG.fillStyle='rgba(255,255,255,'+(.85+Math.sin(tt*2)*.1)+')';bbG.font=`900 84px ${JPFONT}`;bbG.textAlign='left';bbG.fillText('SYNAPSE',28,110);
  bbG.font=`700 30px ${JPFONT}`;bbG.fillStyle='#3ef2ff';bbG.fillText('シナプス・コーラ — 脳まで冷える',30,160);
  bbG.fillStyle='#07040e';bbG.fillRect(0,200,512,56);bbG.fillStyle='#ffb627';bbG.font=`700 26px ${JPFONT}`;
  const msg='　◆ 本日の降水量 412mm　◆ 今夜はゆっくり休みましょう　◆ 第七層 夜間照明 通常運転中　◆ 空中テラス「宵闇」 本日も営業中　';
  const w=bbG.measureText(msg).width;const off=-(tt*60%w);bbG.fillText(msg,off,238);bbG.fillText(msg,off+w,238);
  bbTex.needsUpdate=true;
}
for(const [z,ry,y] of [[-118,0,40],[118,Math.PI,34]]){const b=new THREE.Mesh(new THREE.PlaneGeometry(26,13),bbMat);b.position.set(0,y,z);b.rotation.y=ry;scene.add(b);}

const cars=[];
(function(){
  const bodyM=new THREE.MeshStandardMaterial({color:0x22202e,metalness:.8,roughness:.3});
  const tailM=new THREE.MeshBasicMaterial({color:0xff2244}),headM=new THREE.MeshBasicMaterial({color:0xbff6ff});
  const bodyG=new THREE.BoxGeometry(1.7,.55,3.6),lightG=new THREE.BoxGeometry(.35,.12,.05);
  for(let i=0;i<40;i++){
    const g=new THREE.Group();g.add(new THREE.Mesh(bodyG,bodyM));
    for(const sx of [-.55,.55]){const t1=new THREE.Mesh(lightG,tailM);t1.position.set(sx,0,1.82);g.add(t1);const h=new THREE.Mesh(lightG,headM);h.position.set(sx,0,-1.82);g.add(h);}
    const dir=Math.random()<.5?1:-1;
    g.position.set(dir>0?rand(1,4):rand(-4,-1),pick([16,22,30,38,44,62])+rand(-.5,.5),rand(-130,130));
    if(dir>0)g.rotation.y=Math.PI;scene.add(g);cars.push({g,dir,speed:rand(10,22)});
  }
})();

const walkers=[];
(function(){
  const bodyG=new THREE.CylinderGeometry(.2,.27,1.15,8),headG=new THREE.SphereGeometry(.14,10,8),legG=new THREE.BoxGeometry(.1,.55,.12);
  const umbG=new THREE.ConeGeometry(.62,.25,12,1,true),rimG=new THREE.TorusGeometry(.62,.015,4,24),visorG=new THREE.BoxGeometry(.2,.04,.05);
  const coatMs=[0x2b2338,0x1d2a33,0x3a1f2a,0x262626,0x33304a].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:.5,metalness:.3}));
  const skinMs=[0xd9b08c,0xa8754f,0xf0cfb0,0x6e4a33,0xb7c7d6].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:.6}));
  const umbM=new THREE.MeshStandardMaterial({color:0x14121c,transparent:true,opacity:.85,side:THREE.DoubleSide});
  const rimMs=NEON.map(c=>new THREE.MeshBasicMaterial({color:c}));const darkM=new THREE.MeshBasicMaterial({color:0x111111});
  for(let i=0;i<34;i++){
    const g=new THREE.Group();
    const body=new THREE.Mesh(bodyG,pick(coatMs));body.position.y=1.08;g.add(body);
    const legs=[-.09,.09].map(x=>{const l=new THREE.Mesh(legG,darkM);l.position.set(x,.3,0);g.add(l);return l;});
    const head=new THREE.Mesh(headG,pick(skinMs));head.position.y=1.8;g.add(head);
    const rimM=pick(rimMs);
    if(Math.random()<.75){const u=new THREE.Mesh(umbG,umbM);u.position.y=2.2;g.add(u);const r=new THREE.Mesh(rimG,rimM);r.rotation.x=Math.PI/2;r.position.y=2.08;g.add(r);}
    else{const v=new THREE.Mesh(visorG,rimM);v.position.set(0,1.82,.13);g.add(v);}
    const side=Math.random()<.6?1:-1,dir=Math.random()<.5?-1:1;
    g.position.set(side*rand(5.4,6.6),0,rand(-60,60));g.rotation.y=dir>0?0:Math.PI;
    scene.add(g);walkers.push({g,legs,dir,speed:rand(.7,1.3),phase:rand(0,6)});
  }
})();

/* rain */
const RAIN=3200,rainPos=new Float32Array(RAIN*6);let rainHole=false;
function holeFix(i){if(!rainHole)return;const k=i*6;const x=rainPos[k],z=rainPos[k+2];
  if(Math.abs(x)<8&&Math.abs(z)<8){const nx=x+(x<0?-8:8);rainPos[k]=nx;rainPos[k+3]=nx+.03;}}

  for(const c of controllers){

    const hits=ray.intersectObjects(vis,false);const b=hits.length?hits[0].object.userData.btn:null;
    c.userData.line.scale.z=hits.length?hits[0].distance:1.5;c.userData.dot.visible=!!hits.length;if(hits.length)c.userData.dot.position.copy(hits[0].point);
    if(c.userData.hover!==b){if(c.userData.hover&&!used.has(c.userData.hover)){c.userData.hover.hover=false;c.userData.hover.redraw();}c.userData.hover=b;if(b){b.hover=true;b.redraw();}}

    const s=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','bounded-floor']});
    renderer.xr.setReferenceSpaceType('local-floor');await renderer.xr.setSession(s);
    camera.position.set(0,0,0);camera.rotation.set(0,0,0);
    enter('cafe');
    s.addEventListener('end',()=>{camera.position.set(0,SPACES[space].seats[seatIdx].eye||1.32,0);for(const c of controllers)c.userData.dot.visible=false;});
  }catch(e){$('vrstatus').textContent='VRを開始できませんでした（'+e.message+'）';}
});

/* ---------- arrival ---------- */
function enter(sp){
  audio.init();active=true;$('menu').hidden=true;
  const flat=!renderer.xr.isPresenting;$('home').hidden=!flat;$('tip').hidden=!flat;
  space=sp;seatIdx=0;if(drinkObj){scene.remove(drinkObj);drinkObj=null;}
  applySeat();setTimeout(()=>caption(SPACES[sp].greet),700);
  fade={t:0,phase:'in'};blackout.material.opacity=1;
}
document.querySelectorAll('.dest').forEach(b=>b.addEventListener('click',()=>enter(b.dataset.space)));
$('home').addEventListener('click',()=>{active=false;$('menu').hidden=false;$('home').hidden=true;$('tip').hidden=true;setHover(null);});

/* ---------- loop ---------- */
const robotLines=['「今夜の雨は細かいですね。こういう夜は、時間がゆっくり流れます」','「おかわりはいつでもどうぞ。急ぐ理由はここにはありません」','「下の通りの傘、上から見ると花畑みたいなんですよ」','「閉店時間は決めていないんです。好きなだけいてくださいね」','「窓に流れる雨粒を、ひとつ選んで追いかけてみてください」'];
let lastT=performance.now(),t=0,bbT=0,glassT=0,idleT=40,uiClock=0;
function tick(){
  const now=performance.now();const dt=Math.min(.05,(now-lastT)/1000);lastT=now;t+=dt;
  const xr=renderer.xr.isPresenting;
  const rp=rainPos;
  for(let i=0;i<RAIN;i++){const k=i*6;rp[k+1]-=22*dt;rp[k+4]-=22*dt;if(rp[k+1]<0){rp[k+1]+=32;rp[k+4]+=32;holeFix(i);}}
  rainGeo.attributes.position.needsUpdate=true;
  for(const c of cars){c.g.position.z+=c.dir*c.speed*dt;if(c.g.position.z>140)c.g.position.z=-140;if(c.g.position.z<-140)c.g.position.z=140;}
  for(const w of walkers){w.g.position.z+=w.dir*w.speed*dt;if(w.g.position.z>60)w.g.position.z=-60;if(w.g.position.z<-60)w.g.position.z=60;
    const sw=Math.sin(t*w.speed*5+w.phase);w.legs[0].rotation.x=sw*.4;w.legs[1].rotation.x=-sw*.4;w.g.position.y=Math.abs(sw)*.03;}
  for(const s of signs)if(s.flicker)s.mat.opacity=Math.random()<.03?.2:1;
  holo.rotation.y+=dt*.12;holoRing.rotation.z+=dt*.3;
  bbT+=dt;if(bbT>.1){bbT=0;drawBillboard(t);}
  if(space==='cafe'){glassT+=dt;if(glassT>.05){window.__drawGlass(glassT);glassT=0;}}
  const head=new V3();camera.getWorldPosition(head);
  for(const r of robots){if(r.space&&r.space!==space)continue;r.update(t,dt,head);}
  for(const s of steamSprites){s.userData.ph=(s.userData.ph+dt*.25)%1;const p=s.userData.ph;s.position.set(Math.sin(p*6+t)*.012,.09+p*.22,0);s.scale.setScalar(.05+p*.12);s.material.opacity=Math.sin(p*Math.PI)*.22;}
  if(breathOn){breathT+=dt;const c=breathT%12;let k,txt;
    if(c<4){k=c/4;txt='吸って…';}else if(c<6){k=1;txt='止めて';}else{k=1-(c-6)/6;txt='吐いて…';}
    const e=.5-.5*Math.cos(k*Math.PI);orbCore.scale.setScalar(1+e*1.6);orbGlow.scale.setScalar(.6+e*1.4);setBreathCap(txt);
    if(breathT>60){breathOn=false;breathOrb.visible=false;caption('おつかれさまでした。少し、軽くなりましたか？');redrawUI();}}
  if(active){
    if(!xr){rig.rotation.y=SPACES[space].seats[seatIdx].yaw+yaw;camera.rotation.set(pitch,0,0);}
    else updateVRPointers();
    idleT-=dt;if(idleT<=0){idleT=rand(70,110);if(!breathOn)caption(SPACES[space].staff+pick(robotLines));}
    uiClock+=dt;if(uiClock>20){uiClock=0;header.redraw();}
  }else{rig.rotation.y+=dt*.03;}
  if(capT>0){capT-=dt;if(capT<=0)$('caption').classList.remove('show');}
  if(fade){fade.t+=dt;
    if(fade.phase==='out'){blackout.material.opacity=Math.min(1,fade.t/.45);if(fade.t>=.45){fade.cb&&fade.cb();fade={t:0,phase:'in'};}}
    else{blackout.material.opacity=Math.max(0,1-fade.t/.7);if(fade.t>=.7)fade=null;}}
  renderer.render(scene,camera);
}
applySeat();rig.rotation.y=SPACES.cafe.seats[0].yaw+.3;
/* ---------- VRoid staff (staff.glb, VRM 0.0) ---------- */
const POSE={uaZ:1.25,uaX:.28,uaY:0,laY:1.12,laX:0,laZ:0,hX:0,hY:0,hZ:.15};
function setupVRM(vrm,base){
  const B=THREE_VRM.VRMSchema.HumanoidBoneName,E=THREE_VRM.VRMSchema.BlendShapePresetName;
  const g=new THREE.Group();g.position.copy(base.g.position);g.rotation.copy(base.g.rotation);
  vrm.scene.rotation.y=Math.PI;g.add(vrm.scene);scene.add(g);
  vrm.scene.traverse(o=>{if(o.isMesh)o.frustumCulled=false;});
  base.g.visible=false;
  const fill=new THREE.PointLight(0xffd8bc,.5,2.4,2);fill.position.set(0,1.6,.75);g.add(fill);
  const bone=n=>vrm.humanoid.getBoneNode(B[n]);
  const lUA=bone('LeftUpperArm'),rUA=bone('RightUpperArm'),lLA=bone('LeftLowerArm'),rLA=bone('RightLowerArm'),
        lH=bone('LeftHand'),rH=bone('RightHand'),head=bone('Head'),neck=bone('Neck'),chest=bone('Chest')||bone('Spine'),spine=bone('Spine');
  const fingers=['Index','Middle','Ring','Little'].flatMap(f=>['Left','Right'].flatMap(sd=>['Proximal','Intermediate','Distal'].map(k=>({n:bone(sd+f+k),s:sd==='Left'?1:-1})))).filter(x=>x.n);
  if(vrm.lookAt)vrm.lookAt.target=camera;
  const bsp=vrm.blendShapeProxy;const setBS=(k,v)=>{if(bsp)bsp.setValue(E[k],v);};
  let blinkT=2,blink=0,serveT=0,talkT=0,yawS=0,pitchS=0;const tmp=new V3(),inv=new THREE.Matrix4();
  return {g,space:null,
    serve(){serveT=1.8;},
    talk(sec){talkT=Math.max(talkT,sec);},
    update(t,dt,viewer){
      // where is the viewer, in her own frame (+z = her front)
      inv.copy(g.matrixWorld).invert();tmp.copy(viewer).applyMatrix4(inv);
      const hy=1.45;let yaw=clamp(Math.atan2(tmp.x,tmp.z),-1.1,1.1),pit=clamp(Math.atan2(tmp.y-hy,Math.hypot(tmp.x,tmp.z)),-.4,.4);
      yawS+=(yaw-yawS)*Math.min(1,dt*2.5);pitchS+=(pit-pitchS)*Math.min(1,dt*2.5);
      const sk=serveT>0?Math.sin(clamp(1-serveT/1.8,0,1)*Math.PI):0;
      if(neck)neck.rotation.set(-pitchS*.35,yawS*.35,0);
      if(head)head.rotation.set(-pitchS*.5+sk*.12,yawS*.5,Math.sin(t*.45)*.04);
      const br=Math.sin(t*1.5);if(chest)chest.rotation.x=br*.015;if(spine)spine.rotation.set(.04,yawS*.12,0);
      // arms: down, forearms resting forward over the counter; left hand wipes slowly
      const w=Math.sin(t*1.8);
      const P=POSE;
      lUA.rotation.set(P.uaX+w*.03,-P.uaY,P.uaZ);rUA.rotation.set(P.uaX+sk*.5,P.uaY,-P.uaZ+sk*.15);
      lLA.rotation.set(P.laX,-P.laY+w*.1,P.laZ);rLA.rotation.set(P.laX,P.laY-sk*.6,-P.laZ);
      if(lH)lH.rotation.set(P.hX,-P.hY,P.hZ+w*.08);if(rH)rH.rotation.set(P.hX,P.hY,-P.hZ);
      for(const f of fingers)f.n.rotation.z=f.s*.25;
      // face
      blinkT-=dt;if(blinkT<=0){blink=.15;blinkT=rand(2.4,5.5);}
      let bl=0;if(blink>0){blink-=dt;bl=Math.sin(clamp(1-blink/.15,0,1)*Math.PI);}
      if(serveT>0)serveT-=dt;
      setBS('Joy',sk*.8);setBS('Blink',sk>.3?0:bl);
      if(talkT>0){talkT-=dt;const m=Math.abs(Math.sin(t*11))*(.35+.3*Math.abs(Math.sin(t*3.7)));setBS('A',m*.8);setBS('O',m*.25*Math.abs(Math.sin(t*5)));}
      else{setBS('A',0);setBS('O',0);}
      vrm.update(dt);
    }};
}
function loadStaff(){
  if(!THREE.GLTFLoader||!window.THREE_VRM)return;
  fetch('staff.glb').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.arrayBuffer();}).then(async buf=>{
    const loader=new THREE.GLTFLoader();
    for(let i=0;i<2;i++){
      const gltf=await new Promise((res,rej)=>loader.parse(buf.slice(0),'',res,rej));
      THREE_VRM.VRMUtils.removeUnnecessaryJoints(gltf.scene);
      const vrm=await THREE_VRM.VRM.from(gltf);
      const o=setupVRM(vrm,robots[i]);o.space=i===0?'cafe':'bar';robots[i]=o;
    }
  }).catch(e=>console.warn('staff model not loaded:',e));
}
loadStaff();
drawBillboard(0);setupVR();
renderer.setAnimationLoop(tick);
})();
</script>
