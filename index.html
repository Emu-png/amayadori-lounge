<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amayadori Lounge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Share+Tech+Mono&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: full-bleed WebGL lounge; a translucent arrival card picks the destination; in-scene UI lives on a 3D tablet so VR and flat screens share it. Single night look. */
:root{
  --ink:#07040e;
  --panel:rgba(12,8,22,.84);
  --cyan:#3ef2ff;
  --rose:#ff7ab6;
  --amber:#ffc27a;
  --text:#eef3ff;
  --dim:#98a0bd;
  --line:rgba(255,194,122,.28);
  --display:"Chakra Petch","Arial Narrow",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --mono:"Share Tech Mono",ui-monospace,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);overflow:hidden;font-family:var(--body)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c.hover{cursor:pointer}
.screen{position:fixed;inset:0;display:grid;place-items:center;z-index:20;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;
  background:radial-gradient(ellipse at 50% 110%,rgba(255,122,182,.16),transparent 60%),rgba(7,4,14,.45);overflow-y:auto}
.panel{width:min(600px,100%);box-sizing:border-box;background:var(--panel);border:1px solid var(--line);padding:28px 26px;display:grid;gap:18px;
  box-shadow:0 30px 80px rgba(0,0,0,.6);backdrop-filter:blur(6px)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:var(--amber)}
h1{font-family:var(--display);font-weight:500;font-size:clamp(38px,9vw,62px);line-height:.95;margin:0;letter-spacing:.04em;
  text-shadow:0 0 22px rgba(255,122,182,.45);text-wrap:balance}
h1 small{display:block;font-family:var(--body);font-weight:400;font-size:15px;letter-spacing:.42em;color:var(--rose);text-shadow:none;margin-top:12px}
p{margin:0;line-height:1.8;color:#d3d9ee;font-size:14.5px}
.dests{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.dest{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:6px;padding:16px 16px 14px;border:1px solid var(--line);background:rgba(255,194,122,.05);min-width:0;transition:background .2s,border-color .2s}
.dest:hover,.dest:focus-visible{background:rgba(255,194,122,.14);border-color:var(--amber)}
.dest:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.dest b{font-size:18px;font-weight:700}
.dest span{font-size:12.5px;color:var(--dim);line-height:1.6}
.dest i{font-style:normal;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--rose)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button.vr{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;cursor:pointer;border:0;padding:12px 20px;color:var(--ink);background:var(--cyan)}
button.vr:disabled{background:#2a2840;color:#6b6a85;cursor:not-allowed}
button.vr:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.status{font-family:var(--mono);font-size:12px;color:var(--dim);line-height:1.6}
.hint{font-size:12.5px;color:var(--dim);line-height:1.7}
.namebox{display:grid;gap:6px}.namebox label{font-size:12.5px;color:var(--rose);letter-spacing:.08em}
#yourname{font:inherit;font-size:15px;color:var(--text);background:rgba(255,255,255,.06);border:1px solid var(--line);padding:9px 12px;width:min(220px,100%);box-sizing:border-box}
#yourname:focus-visible{outline:2px solid var(--amber)}
#lovereset{all:unset;cursor:pointer;font-size:12px;color:var(--dim);text-decoration:underline}
#lovereset:focus-visible{outline:2px solid var(--amber)}
#home{position:fixed;z-index:12;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));
  font-family:var(--body);font-size:13px;color:var(--text);background:rgba(12,8,22,.6);border:1px solid var(--line);padding:8px 14px;cursor:pointer}
#home:focus-visible{outline:2px solid var(--amber)}
#dbgToggle{position:fixed;z-index:13;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));font:inherit;font-size:12px;color:var(--ink);background:var(--amber);border:0;padding:8px 12px;cursor:pointer}
#dbgToggle:focus-visible,#debug button:focus-visible{outline:2px solid var(--text);outline-offset:2px}
#debug{position:fixed;z-index:13;top:calc(52px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:min(250px,calc(100vw - 32px));max-height:calc(100vh - 140px);overflow-y:auto;
  background:rgba(12,8,22,.92);border:1px solid var(--line);padding:12px;display:grid;gap:10px;box-sizing:border-box}
#debug h3{margin:0;font-size:12px;letter-spacing:.12em;color:var(--amber);font-family:var(--mono)}
#debug .grp{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#debug button{font:inherit;font-size:12px;color:var(--text);background:rgba(255,194,122,.1);border:1px solid var(--line);padding:7px 6px;cursor:pointer;text-align:center}
#debug button:hover{background:rgba(255,194,122,.25)}
#debug button.wide{grid-column:1/-1}
#dbgStat{font-family:var(--mono);font-size:12px;color:var(--rose);line-height:1.6}
#caption{position:fixed;z-index:12;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100vw - 32px);box-sizing:border-box;
  font-size:15px;line-height:1.6;text-align:center;background:rgba(12,8,22,.66);padding:10px 18px;border-left:2px solid var(--amber);opacity:0;transition:opacity .5s;pointer-events:none}
#caption.show{opacity:1}
#tip{position:fixed;z-index:12;top:calc(18px + env(safe-area-inset-top,0px));right:calc(max(16px,env(safe-area-inset-right,0px)) + 74px);font-size:12px;color:var(--dim);background:rgba(12,8,22,.5);padding:6px 10px;max-width:50vw}
</style>
</head>
<body>


<canvas id="c"></canvas>
<button id="home" type="button" hidden>← 行き先を選ぶ</button>
<div id="tip" hidden>ドラッグで見回す · 光るパネルや床の輪をクリック</div>
<button id="dbgToggle" type="button" hidden>テスト</button>
<div id="debug" hidden>
  <div id="dbgStat"></div>
  <div class="grp"><button type="button" data-dbg="target" class="wide" id="dbgTarget">対象：ユイ（押すと切り替え）</button></div>
  <h3>親密度</h3>
  <div class="grp">
    <button type="button" data-dbg="p10">＋10</button><button type="button" data-dbg="p50">＋50</button>
    <button type="button" data-dbg="up">段階を上げる</button><button type="button" data-dbg="down">段階を下げる</button>
    <button type="button" data-dbg="stageline" class="wide">段階アップのセリフを再生</button>
  </div>
  <h3>イベント</h3>
  <div class="grp">
    <button type="button" data-dbg="question">質問する</button><button type="button" data-dbg="sulk">拗ねる</button>
    <button type="button" data-dbg="visit">隣に座る</button><button type="button" data-dbg="invite">バーに誘う</button>
    <button type="button" data-dbg="thunder">雷</button><button type="button" data-dbg="letter">手紙を置く</button>
    <button type="button" data-dbg="yawn">あくび</button><button type="button" data-dbg="chat">ひとこと</button>
    <button type="button" data-dbg="kiss">キス</button><button type="button" data-dbg="lap">膝の上</button>
  </div>
  <h3>表情</h3>
  <div class="grp">
    <button type="button" data-dbg="e:wink">ウインク</button><button type="button" data-dbg="e:shy">はにかみ</button>
    <button type="button" data-dbg="e:pout">拗ね顔</button><button type="button" data-dbg="e:worry">心配顔</button>
  </div>
  <h3>時間帯</h3>
  <div class="grp"><button type="button" data-dbg="band" class="wide" id="dbgBand">実際の時刻</button></div>
  <div class="grp"><button type="button" data-dbg="reset" class="wide" id="dbgReset">関係をリセット</button></div>
</div>
<div id="caption"></div>

<section id="menu" class="screen">
  <div class="panel">
    <div class="eyebrow">// 2089 · カグラ区 · 今夜の雨量 412mm</div>
    <h1>AMAYADORI<small>雨宿りラウンジ</small></h1>
    <p>雨の止まない未来都市の片隅にある、ひと休みのための場所です。目的はありません。窓の外のネオンを眺めて、飲み物を頼んで、少し深呼吸していってください。</p>
    <div class="dests">
      <button class="dest" type="button" data-space="cafe"><i>STREET LEVEL</i><b>カフェ「雨音」</b><span>窓際の席から、雨に濡れた路地と行き交う人々を眺める。窓を打つ雨音と暖かい灯り。</span></button>
      <button class="dest" type="button" data-space="bar"><i>ALT 52M</i><b>空中バー「宵闇」</b><span>街の上に浮かぶテラス。眼下を空飛ぶ車が流れ、巨大なホログラムがゆっくり回る。</span></button>
    </div>
    <div class="namebox">
      <label for="yourname">ユイに呼んでほしい名前</label>
      <div class="row"><input id="yourname" type="text" maxlength="10" placeholder="例：ハル" autocomplete="off"><span class="status" id="lovestat"></span><button id="lovereset" type="button">関係をリセット</button></div>
    </div>
    <div class="row">
      <button id="vrbtn" class="vr" type="button" disabled>VRで入る（カフェから）</button>
      <span class="status" id="vrstatus">VR対応を確認中…</span>
    </div>
    <div class="hint">PC・スマホ：ドラッグで見回し、光るパネルをクリック／タップ。<br>VR：コントローラーで指してトリガー。座ったままで楽しめます。</div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/three@0.137.5/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.137.5/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@0.6.11/lib/three-vrm.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const V3=THREE.Vector3;
const CAFE_K=.8,RZ=z=>12-(12-z)*CAFE_K,CAFE_KX=.8,RX=x=>8+(x-8)*CAFE_KX,BAR_K=.8,RZB=z=>37-(37-z)*BAR_K,RXB=x=>x*BAR_K;
const JPFONT='"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic","Meiryo",sans-serif';
const NEON=[0x3ef2ff,0xff2e88,0xffb627,0x9d5cff,0x39ff9e,0xff5a36];
const hex=c=>'#'+c.toString(16).padStart(6,'0');

/* ---------- renderer / scene ---------- */
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.xr.enabled=true;
const scene=new THREE.Scene();
const OUTLINE={on:true,list:[]};
scene.background=new THREE.Color(0x150a24);
scene.fog=new THREE.FogExp2(0x150a24,0.014);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,0.03,500);
const rig=new THREE.Group();rig.add(camera);scene.add(rig);
camera.position.y=1.32;
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
const hemi=new THREE.HemisphereLight(0x6a4cff,0x1a0820,0.35);scene.add(hemi);

function glowTexture(){const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');
  const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.25,'rgba(255,255,255,.55)');gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);}
const GLOW=glowTexture();
const glowSprite=(color,s,op)=>{const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW,color,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:op==null?1:op}));sp.scale.set(s,s,1);return sp;};

/* ---------- street ---------- */
(function(){
  const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  g.fillStyle='#16141f';g.fillRect(0,0,256,256);
  for(let i=0;i<3000;i++){const v=Math.floor(rand(10,40));g.fillStyle=`rgb(${v},${v},${v+8})`;g.fillRect(rand(0,256),rand(0,256),2,2);}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(8,30);
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(80,300),new THREE.MeshStandardMaterial({color:0x3a3650,map:t,roughness:.22,metalness:.65}));
  ground.rotation.x=-Math.PI/2;scene.add(ground);
  const curbM=new THREE.MeshStandardMaterial({color:0x24222e,roughness:.4,metalness:.4});
  for(const s of [-1,1]){const curb=new THREE.Mesh(new THREE.BoxGeometry(2.4,.12,300),curbM);curb.position.set(s*6.8,.06,0);scene.add(curb);}
  const dashM=new THREE.MeshBasicMaterial({color:0x2a8a96});
  for(let z=-140;z<140;z+=6){const d=new THREE.Mesh(new THREE.PlaneGeometry(.15,2.4),dashM);d.rotation.x=-Math.PI/2;d.position.set(0,.01,z);scene.add(d);}
  const lc=[0x3ef2ff,0xff2e88,0x9d5cff,0x3ef2ff];
  [[-4.5,-20],[4.5,-2],[-4.5,14],[4.5,-50]].forEach(([x,z],i)=>{const l=new THREE.PointLight(lc[i],1.6,12,1);l.position.set(x,4,z);scene.add(l);});
})();

/* ---------- building facades: 5 styles, each 12 m x 24 m (4 bays x 8 floors) ---------- */
const FACADE_STYLES=(function(){
  const W=512,H=1024,BAYS=4,FLOORS=8,bw=W/BAYS,fh=H/FLOORS;
  const SPEC={concrete:{wall:'#5c5955',glass:'#14161c',lit:.36},glass:{wall:'#1a1e26',glass:'#10151d',lit:.22},apartment:{wall:'#7a7068',glass:'#15161b',lit:.48},
    office:{wall:'#42454d',glass:'#12161d',lit:.3},brick:{wall:'#57302a',glass:'#141317',lit:.42}};
  function mk(style){
    const S=SPEC[style],mkc=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;return c;};
    const c=mkc(),e=mkc(),r=mkc(),g=c.getContext('2d'),ge=e.getContext('2d'),gr=r.getContext('2d');
    g.fillStyle=S.wall;g.fillRect(0,0,W,H);ge.fillStyle='#000';ge.fillRect(0,0,W,H);gr.fillStyle='#dadada';gr.fillRect(0,0,W,H);
    for(let i=0;i<6000;i++){g.fillStyle=`rgba(${Math.random()<.5?'0,0,0':'255,255,255'},${Math.random()*.05})`;g.fillRect(Math.random()*W,Math.random()*H,2,2);}
    if(style==='brick')for(let y=0;y<H;y+=8){const off=(y/8)%2?8:0;for(let x=-16;x<W;x+=16){g.fillStyle=`rgba(${Math.random()<.5?'0,0,0':'255,200,170'},${Math.random()*.14})`;g.fillRect(x+off+1,y+1,14,6);}g.fillStyle='rgba(0,0,0,.28)';g.fillRect(0,y,W,1);}
    if(style==='apartment'){for(let y=0;y<H;y+=6){g.fillStyle='rgba(0,0,0,.07)';g.fillRect(0,y,W,1);}for(let x=0;x<W;x+=6){g.fillStyle='rgba(0,0,0,.05)';g.fillRect(x,0,1,H);}}
    if(style==='concrete')for(let y=0;y<H;y+=64){g.fillStyle='rgba(0,0,0,.12)';g.fillRect(0,y,W,1);}
    for(let i=0;i<70;i++){const x=Math.random()*W,y=Math.random()*H,l=40+Math.random()*220;const gd=g.createLinearGradient(0,y,0,y+l);gd.addColorStop(0,'rgba(0,0,0,.2)');gd.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gd;g.fillRect(x,y,2+Math.random()*5,l);}
    const rgb=(a,k)=>`rgb(${a.map(v=>Math.min(255,v*k)|0).join(',')})`;
    function win(x,y,w,h,frame){
      const lit=Math.random()<S.lit;
      if(frame){g.fillStyle='#26272c';g.fillRect(x-3,y-3,w+6,h+6);}
      if(lit){const col=Math.random()<.7?[255,212,158]:[205,228,255],k=.5+Math.random()*.5;
        let gd=g.createLinearGradient(0,y,0,y+h);gd.addColorStop(0,rgb(col,k*.95));gd.addColorStop(1,rgb(col,k*.55));g.fillStyle=gd;g.fillRect(x,y,w,h);
        gd=ge.createLinearGradient(0,y,0,y+h);gd.addColorStop(0,rgb(col,k));gd.addColorStop(1,rgb(col,k*.5));ge.fillStyle=gd;ge.fillRect(x,y,w,h);
        const cur=Math.random();
        if(cur<.35){const cw=w*(.3+Math.random()*.4),sx=Math.random()<.5?x:x+w-cw;
          g.fillStyle='rgba(238,222,196,.6)';g.fillRect(sx,y,cw,h);ge.fillStyle='rgba(90,70,45,.92)';ge.fillRect(sx,y,cw,h);
          for(const cx of [g,ge]){cx.fillStyle='rgba(0,0,0,.2)';for(let f=sx;f<sx+cw;f+=5)cx.fillRect(f,y,1.5,h);}}
        else if(cur<.6){for(const cx of [g,ge]){cx.fillStyle='rgba(0,0,0,.38)';for(let yy=y;yy<y+h;yy+=4)cx.fillRect(x,yy,w,1.5);}}
        else if(cur<.68){const px=x+w*(.25+Math.random()*.5);for(const cx of [g,ge]){cx.fillStyle='rgba(12,9,9,.88)';cx.beginPath();cx.ellipse(px,y+h*.42,w*.055,h*.075,0,0,7);cx.fill();cx.fillRect(px-w*.085,y+h*.52,w*.17,h*.48);}}
        else if(cur<.76){for(const cx of [g,ge]){cx.fillStyle='rgba(20,40,20,.85)';cx.beginPath();cx.ellipse(x+w*.8,y+h*.8,w*.1,h*.2,0,0,7);cx.fill();}}
        gr.fillStyle='#2a2a2a';gr.fillRect(x,y,w,h);
      }else{const gd=g.createLinearGradient(0,y,0,y+h);gd.addColorStop(0,'#2b3142');gd.addColorStop(.55,S.glass);gd.addColorStop(1,'#0b0c10');g.fillStyle=gd;g.fillRect(x,y,w,h);
        g.fillStyle='rgba(160,180,220,.06)';g.beginPath();g.moveTo(x,y+h);g.lineTo(x+w*.4,y);g.lineTo(x+w*.55,y);g.lineTo(x+w*.15,y+h);g.fill();gr.fillStyle='#121212';gr.fillRect(x,y,w,h);}
      g.fillStyle='#26272c';g.fillRect(x+w/2-1.5,y,3,h);ge.fillStyle='#000';ge.fillRect(x+w/2-1.5,y,3,h);
    }
    for(let f=0;f<FLOORS;f++){const y0=f*fh;
      if(style==='glass'){for(let b=0;b<BAYS;b++)win(b*bw+3,y0+4,bw-6,fh-26,false);
        g.fillStyle='#0b0d11';g.fillRect(0,y0+fh-22,W,22);g.fillStyle='rgba(160,180,210,.22)';g.fillRect(0,y0+fh-22,W,1);
        for(let b=0;b<=BAYS;b++){g.fillStyle='#30343c';g.fillRect(b*bw-2,y0,4,fh);}}
      else if(style==='office'){g.fillStyle='rgba(0,0,0,.35)';g.fillRect(0,y0+fh-10,W,10);for(let b=0;b<BAYS*2;b++)win(b*bw/2+5,y0+30,bw/2-10,fh-64,true);}
      else{g.fillStyle='rgba(0,0,0,.3)';g.fillRect(0,y0+fh-7,W,7);g.fillStyle='rgba(255,255,255,.06)';g.fillRect(0,y0+fh-7,W,1);
        for(let b=0;b<BAYS;b++){const ww=style==='apartment'?bw*.64:bw*.5,wh=fh*(style==='brick'?.56:.52),x=b*bw+(bw-ww)/2,y=y0+fh*.16;win(x,y,ww,wh,true);
          g.fillStyle='rgba(205,205,205,.2)';g.fillRect(x-6,y+wh+3,ww+12,4);}}
    }
    const T=t=>{const x=new THREE.CanvasTexture(t);x.wrapS=x.wrapT=THREE.RepeatWrapping;x.anisotropy=4;return x;};
    return new THREE.MeshStandardMaterial({map:T(c),emissive:0xffffff,emissiveMap:T(e),roughnessMap:T(r),roughness:1,metalness:0,envMapIntensity:.9});
  }
  const o={};for(const k in SPEC)o[k]=mk(k);return o;
})();
const roofM=new THREE.MeshStandardMaterial({color:0x1c1b21,roughness:.92});
const FRONT_STYLES=['concrete','apartment','brick','apartment','concrete','office','brick'],TOWER_STYLES=['glass','office','glass','concrete','glass'];
const ROOF={tank:[],ac:[],ant:[]},FAC={ac:[],bal:[]},warnLights=[];
